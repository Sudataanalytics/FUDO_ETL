# Entorno local de pruebas: ETL contra la API real de Fudo, pero escribiendo en un Postgres LOCAL.
# Ver LOCAL_TESTING.md. La base de producción nunca se usa: DB_CONNECTION_STRING se fuerza abajo.

x-etl: &etl
  build:
    # ETL_SRC permite construir otra versión del código (ej. un worktree de main) para comparar
    context: ${ETL_SRC:-.}
    dockerfile: Dockerfile
  env_file: .env
  environment:
    # Siempre la base local, aunque .env tenga otra cosa
    DB_CONNECTION_STRING: postgresql://etl:etl@db:5432/fudo_local
    GCP_PROJECT_ID: local-dev-project
    PYTHONUNBUFFERED: "1"
    ETL_MEM_LIMIT: ${ETL_MEM_LIMIT:-2g}
  # Mismos recursos que Cloud Run (2Gi / 1 CPU por defecto; meso usa 4g / 2)
  mem_limit: ${ETL_MEM_LIMIT:-2g}
  cpus: ${ETL_CPUS:-1}
  volumes:
    - ./scripts:/tools:ro
    - ./profiling:/out
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: etl
      POSTGRES_PASSWORD: etl
      POSTGRES_DB: fudo_local
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./fudo_etl/sql:/repo/fudo_etl/sql:ro
      - ./clients:/repo/clients:ro
      - ./scripts:/tools:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etl -d fudo_local"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Corrida normal (sin profiler): mide duración y memoria pico del contenedor
  etl:
    <<: *etl
    command: ["sh", "/tools/measure.sh"]

  # Perfil de memoria con memray (flamegraph HTML del pico de memoria)
  etl-memray:
    <<: *etl
    profiles: ["profile"]
    command: ["sh", "/tools/profile_memray.sh"]

  # Perfil de tiempo con py-spy (incluye esperas de red/DB con --idle)
  etl-pyspy:
    <<: *etl
    profiles: ["profile"]
    cap_add:
      - SYS_PTRACE
    command: ["sh", "/tools/profile_pyspy.sh"]

volumes:
  pgdata:
