steps:
  # 1. Construir la imagen Docker genérica
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/fudo-etl-repo/fudo-gen-image:latest', '.']
    id: 'Build'

  # 2. Subir la imagen al Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/fudo-etl-repo/fudo-gen-image:latest']
    id: 'Push'

  # 3. Desplegar/Actualizar Job de d-002-miguitas
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'jobs'
      - 'deploy'
      - 'd-002-miguitas'
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/fudo-etl-repo/fudo-gen-image:latest'
      - '--set-env-vars=CLIENT_NAME=miguitas,GCP_PROJECT_ID=$PROJECT_ID,FUDO_AUTH_ENDPOINT=https://auth.fu.do/api,FUDO_API_BASE_URL=https://api.fu.do'
      - '--set-secrets=DB_CONNECTION_STRING=D-002-MIGUITAS-DB-CONN:latest'
      - '--region=southamerica-east1'
      - '--task-timeout=7200'  
      - '--memory=2Gi'         
      - '--cpu=1'
    id: 'Deploy-Miguitas'

  # 4. Desplegar/Actualizar Job de d-003-amoremio
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'jobs'
      - 'deploy'
      - 'd-003-amoremio'
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/fudo-etl-repo/fudo-gen-image:latest'
      - '--set-env-vars=CLIENT_NAME=amoremio,GCP_PROJECT_ID=$PROJECT_ID,FUDO_AUTH_ENDPOINT=https://auth.fu.do/api,FUDO_API_BASE_URL=https://api.fu.do'
      - '--set-secrets=DB_CONNECTION_STRING=D-003-AMOREMIO-DB-CONN:latest'
      - '--region=southamerica-east1'
      - '--task-timeout=7200'  
      - '--memory=2Gi'         
      - '--cpu=1'
    id: 'Deploy-Amoremio'

    # 5. Desplegar/Actualizar Job de d-004-bodegon
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'jobs'
      - 'deploy'
      - 'd-004-bodegon'
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/fudo-etl-repo/fudo-gen-image:latest'
      # Ajustamos CLIENT_NAME a bodegon
      - '--set-env-vars=CLIENT_NAME=bodegon,GCP_PROJECT_ID=$PROJECT_ID,FUDO_AUTH_ENDPOINT=https://auth.fu.do/api,FUDO_API_BASE_URL=https://api.fu.do'
      # El nombre del secreto debe ser el que creaste en GCP
      - '--set-secrets=DB_CONNECTION_STRING=D-004-BODEGON-DB-CONN:latest'
      - '--region=southamerica-east1'
      - '--task-timeout=7200'  
      - '--memory=2Gi'         
      - '--cpu=1'
    id: 'Deploy-Bodegon'

       # 6. Desplegar/Actualizar Job de d-005-foodclub
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'jobs'
      - 'deploy'
      - 'd-005-foodclub'
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/fudo-etl-repo/fudo-gen-image:latest'
      - '--update-env-vars=CLIENT_NAME=foodclub,GCP_PROJECT_ID=$PROJECT_ID,FUDO_AUTH_ENDPOINT=https://auth.fu.do/api,FUDO_API_BASE_URL=https://api.fu.do'
      - '--set-secrets=DB_CONNECTION_STRING=D-005-FOODCLUB-DB-CONN:latest,FUDO_FOODCLUB_APIKEY=FUDO-FOODCLUB-APIKEY:latest,FUDO_FOODCLUB_APISECRET=FUDO-FOODCLUB-APISECRET:latest'
      - '--region=southamerica-east1'
      - '--task-timeout=10800'  
      - '--memory=4Gi'         
      - '--cpu=1'
    id: 'Deploy-Foodclub'

     # 7. Desplegar/Actualizar Job de d-006-lodepepe
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'jobs'
      - 'deploy'
      - 'd-006-lodepepe'
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/fudo-etl-repo/fudo-gen-image:latest'
      - '--set-env-vars=CLIENT_NAME=lodepepe,GCP_PROJECT_ID=$PROJECT_ID,FUDO_AUTH_ENDPOINT=https://auth.fu.do/api,FUDO_API_BASE_URL=https://api.fu.do'
      - '--set-secrets=DB_CONNECTION_STRING=D-006-LODEPEPE-DB-CONN:latest,FUDO_LODEPEPE_SANJUAN_APIKEY=FUDO_LODEPEPE_SANJUAN_APIKEY:latest,FUDO_LODEPEPE_SANJUAN_APISECRET=FUDO_LODEPEPE_SANJUAN_APISECRET:latest,FUDO_LODEPEPE_RIOJA_APIKEY=FUDO_LODEPEPE_RIOJA_APIKEY:latest,FUDO_LODEPEPE_RIOJA_APISECRET=FUDO_LODEPEPE_RIOJA_APISECRET:latest,FUDO_LODEPEPE_UNIPLAZA_APIKEY=FUDO_LODEPEPE_UNIPLAZA_APIKEY:latest,FUDO_LODEPEPE_UNIPLAZA_APISECRET=FUDO_LODEPEPE_UNIPLAZA_APISECRET:latest'
      - '--region=southamerica-east1'
      - '--task-timeout=7200'
      - '--memory=2Gi'
      - '--cpu=1'
    id: 'Deploy-LoDePepe'

    # 8. Desplegar/Actualizar Job de d-007-meso
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'jobs'
      - 'deploy'
      - 'd-007-meso'
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/fudo-etl-repo/fudo-gen-image:latest'
      - '--set-env-vars=CLIENT_NAME=meso,GCP_PROJECT_ID=$PROJECT_ID,FUDO_AUTH_ENDPOINT=https://auth.fu.do/api,FUDO_API_BASE_URL=https://api.fu.do'
      - '--set-secrets=DB_CONNECTION_STRING=D-005-FOODCLUB-DB-CONN:latest,FUDO-MESO-UNIDAD-APIKEY=FUDO-MESO-UNIDAD-APIKEY:latest,FUDO-MESO-UNIDAD-APISECRET=FUDO-MESO-UNIDAD-APISECRET:latest,FUDO-MESO-TALLERPAN-APIKEY=FUDO-MESO-TALLERPAN-APIKEY:latest,FUDO-MESO-TALLERPAN-APISECRET=FUDO-MESO-TALLERPAN-APISECRET:latest,FUDO-MESO-CATAMARCA-APIKEY=FUDO-MESO-CATAMARCA-APIKEY:latest,FUDO-MESO-CATAMARCA-APISECRET=FUDO-MESO-CATAMARCA-APISECRET:latest,FUDO-MESO-TALLERPIZZAS-APIKEY=FUDO-MESO-TALLERPIZZAS-APIKEY:latest,FUDO-MESO-TALLERPIZZAS-APISECRET=FUDO-MESO-TALLERPIZZAS-APISECRET:latest'
      - '--region=southamerica-east1'
      - '--task-timeout=10800'  
      - '--memory=4Gi'         
      - '--cpu=1'
    id: 'Deploy-Meso'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/fudo-etl-repo/fudo-gen-image:latest'

options:
  logging: CLOUD_LOGGING_ONLY